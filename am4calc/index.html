<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content="initial-scale=1, shrink-to-fit=no, width=device-width" name="viewport">
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
    <title>AM4 Calculator - Airline Manager 4 Seat Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #ffffff;
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: #f5f5f7;
            border-radius: 20px;
            border: 1px solid rgba(0, 0, 0, 0.25);
            padding: 3rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        h1 {
            color: #000000;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: rgba(0, 0, 0, 0.6);
            font-size: 1rem;
        }

        .back-link {
            display: inline-block;
            padding: 0.6rem 1.5rem;
            background: #ffffff;
            color: #007aff;
            text-decoration: none;
            margin-bottom: 2rem;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s ease;
            border-radius: 50px;
            border: 1px solid #007aff;
        }

        .back-link:hover {
            background: #f8f8f8;
            color: #0051d5;
            border-color: #0051d5;
        }

        .back-link::before {
            content: '';
        }

        .form-section {
            margin-bottom: 2rem;
        }

        .section-title {
            color: #000000;
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.2);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            color: rgba(0, 0, 0, 0.8);
            font-weight: 500;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        input[type="number"],
        select {
            width: 100%;
            padding: 0.875rem 1rem;
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            color: #000000;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05);
        }

        input[type="number"]::placeholder {
            color: rgba(0, 0, 0, 0.3);
        }

        select {
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1em;
            padding-right: 2.5rem;
        }

        select option {
            background: #ffffff;
            color: #000000;
            padding: 0.5rem;
            border-radius: 8px;
        }

        .demand-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .btn-calculate {
            width: 100%;
            padding: 1rem 2rem;
            background: #007aff;
            color: white;
            border: 1px solid #007aff;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .btn-calculate:hover {
            background: #0051d5;
            border-color: #0051d5;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 122, 255, 0.3);
        }

        .btn-calculate:active {
            transform: translateY(0);
        }

        .result-section {
            margin-top: 2.5rem;
            padding: 2rem;
            background: #f8f8f8;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.2);
            display: none;
        }

        .result-section.show {
            display: block;
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-title {
            color: #000000;
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .result-item {
            text-align: center;
            padding: 1.5rem;
            background: #ffffff;
            border-radius: 10px;
            border: 1px solid rgba(0, 0, 0, 0.2);
        }

        .result-label {
            color: rgba(0, 0, 0, 0.6);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .result-value {
            color: #000000;
            font-size: 2rem;
            font-weight: 700;
        }

        .result-info {
            background: #ffffff;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, 0.2);
            color: rgba(0, 0, 0, 0.7);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .error-message {
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        #customPaxInput {
            display: none;
            margin-top: 1rem;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            .container {
                padding: 2rem 1.5rem;
            }

            h1 {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 0.9rem;
            }

            .section-title {
                font-size: 1.1rem;
            }

            .demand-inputs {
                grid-template-columns: 1fr;
            }

            .result-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 0.75rem;
            }

            .result-item {
                padding: 1rem 0.5rem;
            }

            .result-label {
                font-size: 0.75rem;
            }

            .result-value {
                font-size: 1.3rem;
            }

            .result-info {
                font-size: 0.85rem;
                padding: 0.875rem;
            }

            .btn-calculate {
                font-size: 1rem;
                padding: 0.875rem 1.5rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 0.5rem;
            }

            .container {
                padding: 1.5rem 1rem;
                border-radius: 16px;
            }

            h1 {
                font-size: 1.75rem;
            }

            .back-link {
                padding: 0.5rem 1.2rem;
                font-size: 0.85rem;
            }

            .section-title {
                font-size: 1rem;
                margin-bottom: 1rem;
            }

            input[type="number"],
            select {
                font-size: 0.95rem;
                padding: 0.75rem 0.875rem;
            }

            .result-grid {
                gap: 0.5rem;
            }

            .result-item {
                padding: 0.75rem 0.25rem;
            }

            .result-label {
                font-size: 0.7rem;
                margin-bottom: 0.25rem;
            }

            .result-value {
                font-size: 1.1rem;
            }

            .result-title {
                font-size: 1.2rem;
                margin-bottom: 1rem;
            }

            .result-info {
                font-size: 0.8rem;
                padding: 0.75rem;
            }

            .btn-calculate {
                font-size: 0.95rem;
                padding: 0.75rem 1.25rem;
            }
        }
    </style>

    <div class="container">
        <a href="/" class="back-link">Back to Home</a>

        <div class="header">
            <h1>AM4 Seat Calculator</h1>
            <p class="subtitle">Calculate optimal cabin configuration for Airline Manager 4</p>
        </div>

        <div class="form-section">
            <h2 class="section-title">Route Demand</h2>
            <div class="demand-inputs">
                <div class="form-group">
                    <label for="economyDemand">Economy Class Demand</label>
                    <input type="number" id="economyDemand" placeholder="200" min="0">
                </div>
                <div class="form-group">
                    <label for="businessDemand">Business Class Demand</label>
                    <input type="number" id="businessDemand" placeholder="100" min="0">
                </div>
                <div class="form-group">
                    <label for="firstDemand">First Class Demand</label>
                    <input type="number" id="firstDemand" placeholder="50" min="0">
                </div>
            </div>
        </div>

        <div class="form-section">
            <h2 class="section-title">Aircraft Selection</h2>
            <div class="form-group">
                <label for="aircraftSelect">Select Aircraft</label>
                <select id="aircraftSelect">
                    <option value="">Choose an aircraft</option>
                    <option value="467">Boeing 747-8 (467 PAX)</option>
                    <option value="600">Airbus A380 (600 PAX)</option>
                    <option value="416">Boeing 777-300ER (416 PAX)</option>
                    <option value="440">Boeing 777-9 (440 PAX)</option>
                    <option value="366">Airbus A350-1000 (366 PAX)</option>
                    <option value="325">Boeing 787-10 (325 PAX)</option>
                    <option value="custom">Custom PAX</option>
                </select>
            </div>
            <div class="form-group" id="customPaxInput">
                <label for="customPax">Custom PAX Value</label>
                <input type="number" id="customPax" placeholder="Enter PAX value" min="1">
            </div>
        </div>

        <button class="btn-calculate" onclick="calculateSeats()">Calculate Seat Configuration</button>

        <div class="error-message" id="errorMessage"></div>

        <div class="result-section" id="resultSection">
            <h3 class="result-title">Optimal Seat Configuration</h3>
            <div class="result-grid">
                <div class="result-item">
                    <div class="result-label">First Class</div>
                    <div class="result-value" id="resultFirst">-</div>
                    <div class="result-label" style="margin-top: 0.5rem;">seats</div>
                </div>
                <div class="result-item">
                    <div class="result-label">Business Class</div>
                    <div class="result-value" id="resultBusiness">-</div>
                    <div class="result-label" style="margin-top: 0.5rem;">seats</div>
                </div>
                <div class="result-item">
                    <div class="result-label">Economy Class</div>
                    <div class="result-value" id="resultEconomy">-</div>
                    <div class="result-label" style="margin-top: 0.5rem;">seats</div>
                </div>
            </div>
            <div class="result-info">
                <strong>Configuration Summary:</strong><br>
                Total PAX Used: <span id="totalPaxUsed">-</span> / <span id="totalPaxAvailable">-</span><br>
                Demand Ratio: <span id="demandRatio">-</span><br>
                Seat Ratio: <span id="seatRatio">-</span>
            </div>
        </div>
    </div>

    <script>
        // Show/hide custom PAX input
        document.getElementById('aircraftSelect').addEventListener('change', function() {
            const customInput = document.getElementById('customPaxInput');
            if (this.value === 'custom') {
                customInput.style.display = 'block';
            } else {
                customInput.style.display = 'none';
            }
        });

        function calculateSeats() {
            // Hide previous results and errors
            document.getElementById('resultSection').classList.remove('show');
            document.getElementById('errorMessage').classList.remove('show');

            // Get input values
            const firstDemand = parseInt(document.getElementById('firstDemand').value) || 0;
            const businessDemand = parseInt(document.getElementById('businessDemand').value) || 0;
            const economyDemand = parseInt(document.getElementById('economyDemand').value) || 0;
            
            const aircraftSelect = document.getElementById('aircraftSelect').value;
            let totalPax;

            if (aircraftSelect === 'custom') {
                totalPax = parseInt(document.getElementById('customPax').value) || 0;
            } else {
                totalPax = parseInt(aircraftSelect) || 0;
            }

            // Validation
            if (firstDemand === 0 && businessDemand === 0 && economyDemand === 0) {
                showError('Please enter at least one demand value.');
                return;
            }

            if (totalPax === 0) {
                showError('Please select an aircraft or enter a custom PAX value.');
                return;
            }

            // Calculate demand ratio
            const totalDemand = firstDemand + businessDemand + economyDemand;
            const firstRatio = firstDemand / totalDemand;
            const businessRatio = businessDemand / totalDemand;
            const economyRatio = economyDemand / totalDemand;

            // Calculate seats using iterative approach to maximize PAX usage
            let bestConfig = null;
            let bestPaxUsed = 0;

            // Try different seat combinations
            for (let f = 0; f <= Math.ceil(totalPax / 3); f++) {
                for (let b = 0; b <= Math.ceil((totalPax - f * 3) / 2); b++) {
                    const e = totalPax - f * 3 - b * 2;
                    
                    if (e >= 0) {
                        const totalSeats = f + b + e;
                        if (totalSeats === 0) continue;

                        // Calculate how well this matches the demand ratio
                        const seatFirstRatio = f / totalSeats;
                        const seatBusinessRatio = b / totalSeats;
                        const seatEconomyRatio = e / totalSeats;

                        // Calculate deviation from demand ratio
                        const deviation = Math.abs(seatFirstRatio - firstRatio) +
                                        Math.abs(seatBusinessRatio - businessRatio) +
                                        Math.abs(seatEconomyRatio - economyRatio);

                        const paxUsed = f * 3 + b * 2 + e * 1;

                        // Prefer configurations that use more PAX and have less deviation
                        if (paxUsed >= bestPaxUsed && (!bestConfig || deviation < bestConfig.deviation)) {
                            bestConfig = {
                                first: f,
                                business: b,
                                economy: e,
                                paxUsed: paxUsed,
                                deviation: deviation
                            };
                            bestPaxUsed = paxUsed;
                        }
                    }
                }
            }

            if (!bestConfig) {
                showError('Unable to calculate seat configuration. Please check your inputs.');
                return;
            }

            // Display results
            document.getElementById('resultFirst').textContent = bestConfig.first;
            document.getElementById('resultBusiness').textContent = bestConfig.business;
            document.getElementById('resultEconomy').textContent = bestConfig.economy;
            document.getElementById('totalPaxUsed').textContent = bestConfig.paxUsed;
            document.getElementById('totalPaxAvailable').textContent = totalPax;
            
            const demandRatioText = `${firstDemand}:${businessDemand}:${economyDemand}`;
            const seatRatioText = `${bestConfig.first}:${bestConfig.business}:${bestConfig.economy}`;
            
            document.getElementById('demandRatio').textContent = demandRatioText;
            document.getElementById('seatRatio').textContent = seatRatioText;

            document.getElementById('resultSection').classList.add('show');
        }

        function showError(message) {
            const errorElement = document.getElementById('errorMessage');
            errorElement.textContent = message;
            errorElement.classList.add('show');
        }

        // Allow Enter key to trigger calculation
        document.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                calculateSeats();
            }
        });
    </script>
</body>

</html>
